<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le Mystère de l'Horloger</title>
    <script type="module" crossorigin src="./assets/main-Bhd1IhZ3.js"></script>
    <script type="module" crossorigin src="./assets/modulepreload-polyfill-P2Xu9kJm.js"></script>
  </head>
  <body>
  <div id="app"></div>
  <div id="message" style="
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-family: sans-serif;
    font-size: 20px;
    background: rgba(0,0,0,0.6);
    padding: 10px 20px;
    border-radius: 8px;
    max-width: 480px;
    display: none;
  "></div>

  <div id="barre-sauvegarde" style="
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  gap: 8px;
">
  <button id="btn-nouvelle-partie" style="
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    white-space: nowrap;
  ">🆕 Nouvelle partie</button>

  <button id="btn-charger" style="
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    white-space: nowrap;
  ">📂 Charger</button>

  <button id="btn-sauvegarder" style="
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    white-space: nowrap;
  ">💾 Sauvegarder</button>
</div>

<div id="puzzle-engrenages" style="
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(20, 20, 25, 0.95);
  padding: 24px;
  border-radius: 12px;
  color: white;
  font-family: sans-serif;
  text-align: center;
  display: none;
">
  <h3>Alignez les engrenages</h3>
  <p>Cliquez sur chaque engrenage pour le faire tourner. Trouvez la bonne combinaison.</p>

  <button id="engrenage-0" style="font-size: 24px; padding: 12px 20px; margin: 8px; border-radius: 8px; border: none;">0</button>
  <button id="engrenage-1" style="font-size: 24px; padding: 12px 20px; margin: 8px; border-radius: 8px; border: none;">0</button>
  <button id="engrenage-2" style="font-size: 24px; padding: 12px 20px; margin: 8px; border-radius: 8px; border: none;">0</button>

  <br />
  <button id="valider-engrenages" style="font-size: 16px; padding: 10px 20px; margin-top: 16px; border-radius: 8px; border: none;">Valider</button>

  <br />
  <button id="btn-indice-engrenages" style="font-size: 14px; padding: 8px 14px; margin-top: 12px; border-radius: 8px; border: none; cursor: pointer;">💡 Lire le cartel de la vitrine</button>

  <p id="indice-engrenages" style="display: none; font-style: italic; font-size: 15px; margin-top: 12px;">
    « Ce mécanisme répond au rythme de l'échappement préféré de Jean-Baptiste : <strong>UN</strong> temps de silence, <strong>TROIS</strong> temps de marche, <strong>DEUX</strong> temps de repos. »
  </p>
</div>

  <div id="actions" style="
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column-reverse;
  gap: 8px;
  align-items: center;
  max-height: 60vh;
  overflow-y: auto;
"></div>

</body>
</html>
