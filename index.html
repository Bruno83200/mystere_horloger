    <style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#10171a}#ecran-accueil,#cadre-sommaire{border:0;width:100%;height:100%;position:fixed;inset:0}#ecran-accueil{z-index:10;isolation:isolate;background:#10171a;overflow:hidden}#ecran-accueil:before{content:"";z-index:-1;filter:blur(16px)brightness(.48);pointer-events:none;background:url(./images/mystere.jpg) 50%/cover no-repeat;position:absolute;inset:-18px;transform:scale(1.04)}#ecran-accueil[hidden],#cadre-sommaire[hidden],#jeu-shell[hidden]{display:none!important}#affiche-accueil{z-index:0;object-fit:contain;object-position:center;width:100%;height:100%;display:block;position:absolute;inset:0}#ecran-accueil:after{content:"";z-index:1;pointer-events:none;background:linear-gradient(#0000 0%,#05090b29 35%,#05090b85 100%);position:absolute;inset:55% 0 0}#btn-demarrer{z-index:2;color:#f5e8c6;letter-spacing:.17em;text-transform:uppercase;cursor:pointer;background:#121a1cbd;border:1px solid #efd79ee6;border-radius:14px;min-width:220px;padding:17px 38px;font:600 clamp(17px,1.9vw,24px)/1.1 Georgia,Times New Roman,serif;transition:background-color .2s,border-color .2s,transform .2s;position:absolute;top:67%;left:50%;transform:translate(-50%,-50%);box-shadow:0 8px 28px #00000073,inset 0 0 0 1px #efd79e26}#btn-demarrer:hover:not(:disabled){background:#353023e0;border-color:#fff0bf;transform:translate(-50%,-50%)scale(1.035)}#btn-demarrer:focus-visible{outline-offset:4px;outline:3px solid #fff0bf}#btn-demarrer:disabled{cursor:progress;opacity:.88}#cadre-sommaire{z-index:20;background:#202426;display:block}#cadre-sommaire[hidden]{display:none!important}#alerte-audio{z-index:30;color:#f5e8c6;text-align:center;background:#191b1af0;border:1px solid #c9b58ba6;border-radius:4px;width:min(560px,100vw - 28px);padding:10px 14px;font:14px/1.45 system-ui,sans-serif;position:fixed;top:14px;left:50%;transform:translate(-50%)}#alerte-audio[hidden]{display:none!important}#jeu-shell{width:100%;height:100%;position:fixed;inset:0}@media (width<=600px){#btn-demarrer{letter-spacing:.12em;min-width:190px;padding:15px 30px}}@media (prefers-reduced-motion:reduce){#btn-demarrer{transition:none}}</style>

  <body>
    <main id="ecran-accueil" aria-label="Écran de présentation du jeu">
      <img id="affiche-accueil" src="./images/mystere.jpg" alt="Affiche du Mystère de l'Horloger, entre atelier d'horlogerie et citadelle" />
      <button id="btn-demarrer" type="button">DÉMARREZ</button>
    </main>

    <iframe id="cadre-sommaire" src="./sommaire.html" title="Présentation du jeu" hidden></iframe>
    <div id="alerte-audio" role="status" aria-live="polite" hidden></div>

    <div id="jeu-shell" hidden>
      <div id="app"></div>
  <div id="message" style="
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-family: sans-serif;
    font-size: 20px;
    background: rgba(0,0,0,0.6);
    padding: 10px 20px;
    border-radius: 8px;
    max-width: 480px;
    display: none;
  "></div>

  <div id="barre-sauvegarde" style="
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  gap: 8px;
">
  <button id="btn-nouvelle-partie" style="
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    white-space: nowrap;
  ">🆕 Nouvelle partie</button>

  <button id="btn-charger" style="
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    white-space: nowrap;
  ">📂 Charger</button>

  <button id="btn-sauvegarder" style="
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    white-space: nowrap;

</div>

<div id="puzzle-engrenages" style="
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(20, 20, 25, 0.95);
  padding: 24px;
  border-radius: 12px;
  color: white;
  font-family: sans-serif;
  text-align: center;
  display: none;
">
  <h3>Alignez les engrenages</h3>
  <p>Cliquez sur chaque engrenage pour le faire tourner. Trouvez la bonne combinaison.</p>

  <button id="engrenage-0" style="font-size: 24px; padding: 12px 20px; margin: 8px; border-radius: 8px; border: none;">0</button>
  <button id="engrenage-1" style="font-size: 24px; padding: 12px 20px; margin: 8px; border-radius: 8px; border: none;">0</button>
  <button id="engrenage-2" style="font-size: 24px; padding: 12px 20px; margin: 8px; border-radius: 8px; border: none;">0</button>

  <button id="valider-engrenages" style="font-size: 16px; padding: 10px 20px; margin-top: 16px; border-radius: 8px; border: none;">Valider</button>

  <br />
  <button id="btn-indice-engrenages" style="font-size: 14px; padding: 8px 14px; margin-top: 12px; border-radius: 8px; border: none; cursor: pointer;">💡 Lire le cartel de la vitrine</button>

  <p id="indice-engrenages" style="display: none; font-style: italic; font-size: 15px; margin-top: 12px;">
    « Ce mécanisme répond au rythme de l'échappement préféré de Jean-Baptiste : <strong>UN</strong> temps de silence, <strong>TROIS</strong> temps de marche, <strong>DEUX</strong> temps de repos. »
  </p>
</div>

  <div id="actions" style="
  position: fixed;
  bottom: 20px;

  transform: translateX(-50%);

  max-height: 60vh;
  overflow-y: auto;
"></div>
